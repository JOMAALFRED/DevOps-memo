apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memo-saas-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/JOMAALFRED/DevOps-memo.git
    targetRevision: main
    path: argocd/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - Validate=true
