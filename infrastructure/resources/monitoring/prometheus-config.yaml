apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    storage:
      tsdb:
        retention:
          time: 3d

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: traefik
        static_configs:
          - targets:
              - traefik-metrics.kube-system.svc.cluster.local:9100

      - job_name: argo-rollouts
        static_configs:
          - targets:
              - argo-rollouts-metrics.argo-rollouts.svc.cluster.local:8090
