{{- if .Values.frontend.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "dental-saas.fullname" . }}-frontend
  labels:
    {{- include "dental-saas.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "dental-saas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "dental-saas.fullname" . }}-frontend
    scaleDown: onsuccess
  strategy:
    canary:
      stableService: {{ include "dental-saas.fullname" . }}-frontend
      canaryService: {{ include "dental-saas.fullname" . }}-frontend-preview
      trafficRouting:
        traefik:
          weightedTraefikServiceName: {{ include "dental-saas.fullname" . }}-frontend-weighted
      maxSurge: 1
      maxUnavailable: 0
      scaleDownDelaySeconds: 30
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: {{ include "dental-saas.fullname" . }}-frontend-analysis
        - pause: {}
        - setWeight: 30
        - pause: {}
        - setWeight: 50
        - pause: {}
        - setWeight: 100
{{- end }}