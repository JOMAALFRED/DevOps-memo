{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dental-saas.fullname" . }}-postgresql
  labels:
    {{- include "dental-saas.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql

spec:
  type: ClusterIP
  clusterIP: None

  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP

  selector:
    {{- include "dental-saas.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}