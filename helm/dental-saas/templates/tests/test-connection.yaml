{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "dental-saas.fullname" . }}-test-connection"
  labels:
    {{- include "dental-saas.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['-q', '--spider', '{{ include "dental-saas.fullname" . }}-frontend:{{ .Values.frontend.service.port }}']
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
  restartPolicy: Never
{{- end }}