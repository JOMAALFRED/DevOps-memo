nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/jomaalfred/dental-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/jomaalfred/dental-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  database:
    name: dental_demo
    existingSecret: dental-saas-secrets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "8.0"
    pullPolicy: IfNotPresent
  service:
    port: 27017
  auth:
    existingSecret: dental-saas-secrets
    usernameKey: mongodb-root-username
    passwordKey: mongodb-root-password
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
