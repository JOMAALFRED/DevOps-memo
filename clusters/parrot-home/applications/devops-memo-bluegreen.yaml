apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-memo-bluegreen
  namespace: argocd
  labels:
    environment: parrot-home
    application: devops-memo-demo
spec:
  project: default

  source:
    repoURL: https://github.com/JOMAALFRED/DevOps-memo.git
    targetRevision: main
    path: apps/demo-web/k8s/blue-green

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-memo-bluegreen

  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash

  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
